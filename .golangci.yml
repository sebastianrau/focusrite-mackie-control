version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
    - unconvert
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sebastianrau/focusrite-mackie-control
